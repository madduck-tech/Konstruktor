[project]
name = "konstruktor"
version = "0.1.0"
description = "Autonomous agent that turns problems into working solutions."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexey" }]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.8",
]

[project.scripts]
konstruktor = "konstruktor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konstruktor"]

[tool.hatch.build.targets.wheel.force-include]
"src/konstruktor/config.default.yaml" = "konstruktor/config.default.yaml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/test_parser.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
