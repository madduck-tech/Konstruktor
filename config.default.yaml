# ==============================================================================
# Konstruktor default configuration
# ==============================================================================

llm:
  model: "claude-sonnet-4-5-20250929"
  api_key: "${LLM_API_KEY}"
  base_url: null

limits:
  timeout: 1800
  step_timeout: 300
  max_steps: 100
  max_retries: 0

agent:
  mode: "auto"
  sandbox: "process"
  skills_dir: null

# Plan mode — spec-driven pipeline settings
plan:
  max_fix_cycles: 2        # max fix-only cycles after failed verification
  spec_lint_enabled: true   # run spec quality review before implementation
  max_iterations: 3         # legacy: initial implement→verify attempts (unused in new pipeline)

logging:
  dir: "./konstruktor-output"
  level: "info"
  format: "jsonl"
  keep_runs: 10

security:
  allowed_commands: []
  # Command policies must remain empty until the OpenHands CLI can enforce them.
  blocked_commands: []
  require_approval_for: []
